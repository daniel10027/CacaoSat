# Déploiement de référence de l'API sur Fly.io (free allowance). Non requis pour la démo.
#
#   fly launch --no-deploy --copy-config --dockerfile backend/Dockerfile
#   fly postgres create --name cacaosat-db --region cdg
#   fly postgres attach cacaosat-db            # injecte DATABASE_URL
#   fly secrets set SECRET_KEY=... JWT_SECRET_KEY=...
#   fly deploy
#
# La release_command applique les migrations avant chaque bascule de version.

app = "cacaosat-backend"
primary_region = "cdg"          # Paris — proche de la Côte d'Ivoire

[build]
  dockerfile = "../../backend/Dockerfile"

[env]
  FLASK_CONFIG = "production"
  PORT = "8000"
  SEED_ON_START = "1"           # jeu de démo déterministe au premier boot

[deploy]
  release_command = "flask db upgrade"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
