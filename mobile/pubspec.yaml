name: cacaosat
description: "CacaoSat — collecte terrain hors-ligne des parcelles cacaoyères (conformité EUDR)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # État
  flutter_riverpod: ^2.6.1

  # Réseau
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Base locale hors-ligne
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Navigation
  go_router: ^14.6.2

  # Sécurité / stockage
  flutter_secure_storage: ^9.2.2

  # Géo / carte / GPS
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  flutter_map: ^7.0.2

  # Sync en arrière-plan + notifications
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main
  flutter_local_notifications: ^18.0.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  intl: ^0.19.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#08130E"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#08130E"
  image: "assets/icon.png"
  android_12:
    color: "#08130E"
    image: "assets/icon.png"
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
