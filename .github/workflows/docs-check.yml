name: docs-check

on:
  push:
    branches: [develop, preprod, prod]
    paths: ["docs/**", "ROADMAP.md", "README.md", "scripts/check_docs.py"]
  pull_request:
    paths: ["docs/**", "ROADMAP.md", "README.md"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
