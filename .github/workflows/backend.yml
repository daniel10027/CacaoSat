name: backend

on:
  push:
    branches: [develop, preprod, prod]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cacaosat
          POSTGRES_PASSWORD: cacaosat
          POSTGRES_DB: cacaosat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cacaosat" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://cacaosat:cacaosat@localhost:5432/cacaosat
      TEST_DATABASE_URL: postgresql+psycopg://cacaosat:cacaosat@localhost:5432/cacaosat_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_APP: wsgi.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Migrations réversibles
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade
      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
